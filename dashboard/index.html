<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d273b" />
    <meta
      name="description"
      content="Interactive order-to-delivery operations analytics portfolio dashboard by Youssef Khoury."
    />
    <title>Order-to-Delivery Control Tower | Youssef Khoury</title>
    <link rel="icon" href="/dashboard/logo.png" type="image/png" />
    <script>
      (function () {
        var params = new URLSearchParams(location.search);
        var fromParent = params.get("theme");
        var theme = fromParent === "light" || fromParent === "dark" ? fromParent : localStorage.getItem("otd-theme");
        document.documentElement.dataset.theme = theme === "light" ? "light" : "dark";
      })();
    </script>
    <script type="module" crossorigin src="/dashboard/assets/index-4KOYwEF0.js"></script>
    <link rel="stylesheet" crossorigin href="/dashboard/assets/index-_Y0N2A8a.css?v=3">
    <style>
      /* boot splash: React swaps it out on mount, so it only ever shows while the
         bundle is parsing. Theme is already resolved by the inline script above. */
      #boot { position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 20px; background: #071019; }
      html[data-theme="light"] #boot { background: #f3f6f8; }
      #boot .bm { width: 64px; height: 64px; background: #4ad6cd;
        -webkit-mask: url("/dashboard/logo-x.png") center / contain no-repeat;
        mask: url("/dashboard/logo-x.png") center / contain no-repeat;
        animation: bootpulse 1.7s ease-in-out infinite; }
      html[data-theme="light"] #boot .bm { background: #16a7a1; }
      #boot .bl { margin: 0; font: 400 10px/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        letter-spacing: 0.18em; text-transform: uppercase; color: #6c7a89; }
      #boot .bb { width: 132px; height: 2px; overflow: hidden; border-radius: 2px;
        background: rgba(108,122,137,.25); }
      #boot .bb::after { content: ""; display: block; width: 40%; height: 100%;
        background: #4ad6cd; animation: bootslide 1.2s ease-in-out infinite; }
      html[data-theme="light"] #boot .bb::after { background: #16a7a1; }
      @keyframes bootpulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
      @keyframes bootslide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) {
        #boot .bm { animation: none; opacity: .9; }
        #boot .bb::after { animation: none; width: 100%; }
      }
    </style>
  </head>
  <body>
    <div id="root"><div id="boot">
        <span class="bm" aria-hidden="true"></span>
        <p class="bl">Loading control tower</p>
        <span class="bb" aria-hidden="true"></span>
      </div></div>
  </body>
</html>
