<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#100E0C" />
    <meta name="robots" content="noindex" />
    <title>Page not found &#183; Youssef Khoury</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png?v=3" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chivo:wght@700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" />
    <style>
      :root { --bg:#100E0C; --line:#322A24; --ink:#ECE3D6; --muted:#ADA192; --accent:#E8B15A; }
      * { box-sizing: border-box; margin: 0; }
      html, body { height: 100%; }
      body {
        background: var(--bg); color: var(--ink);
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        display: grid; place-items: center; padding: 24px 16px;
        background-image: radial-gradient(rgba(236,227,214,.07) 1px, transparent 1px);
        background-size: 22px 22px;
      }
      main { max-width: 34rem; width: 100%; border: 1px solid var(--line); padding: 40px 32px; background: rgba(16,14,12,.92); }
      .code { color: var(--accent); font-size: 13px; letter-spacing: .14em; text-transform: uppercase; }
      h1 { font-family: "Chivo", system-ui, sans-serif; font-weight: 800; font-size: clamp(30px, 7vw, 44px); line-height: 1.08; margin: 14px 0 12px; letter-spacing: -.01em; }
      p { color: var(--muted); font-size: 14px; line-height: 1.6; }
      nav { display: flex; flex-wrap: wrap; gap: 10px 22px; margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--line); }
      a { color: var(--ink); font-size: 13px; text-decoration: none; border-bottom: 1px solid var(--line); padding-bottom: 2px; }
      a:hover, a:focus-visible { color: var(--accent); border-color: var(--accent); outline: none; }
      .ar { color: var(--accent); margin-right: 6px; }
    </style>
  </head>
  <body>
    <main>
      <p class="code">Error 404</p>
      <h1>This page doesn&rsquo;t exist.</h1>
      <p>The link may be old or mistyped. Everything on the site is reachable from the home page.</p>
      <nav>
        <a href="/"><span class="ar">&#8599;</span>Home</a>
        <a href="/#work"><span class="ar">&#8599;</span>Selected work</a>
        <a href="/beacon/"><span class="ar">&#8599;</span>Beacon</a>
        <a href="/dashboard/"><span class="ar">&#8599;</span>Live dashboard</a>
      </nav>
    </main>
  </body>
</html>
